<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Accès protégé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C2340; --navy-d:#081a31; --accent:#00A489;
    --ink:#15233a; --muted:#5b6b80; --line:#e7ecf3; --soft:#f6f9fc;
    --e:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:'Montserrat',system-ui,-apple-system,sans-serif; color:var(--ink);
    background:var(--soft); display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(135deg,var(--navy-d) 0%,var(--navy) 55%,#0b3a72 100%)}
  .bg span{position:absolute;border-radius:9999px;border:1px solid rgba(255,255,255,.08)}
  .bg span:nth-child(1){width:520px;height:520px;top:-160px;right:-120px}
  .bg span:nth-child(2){width:340px;height:340px;bottom:-90px;left:-70px}
  .bg span:nth-child(3){width:760px;height:760px;top:50%;left:50%;transform:translate(-50%,-50%)}
  .wrap{position:relative;z-index:1;width:100%;max-width:430px}
  .card{background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 1px 2px rgba(0,40,86,.06),0 24px 60px -20px rgba(0,27,61,.55)}
  .logo{display:block;height:38px;width:auto;margin:0 auto 22px}
  h1{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.01em;text-align:center}
  .sub{margin:0 0 24px;font-size:13.5px;line-height:1.55;color:var(--muted);text-align:center}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--navy)}
  .field{display:flex;gap:8px}
  input[type=password],input[type=text]{
    flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 13px;border:1px solid #c3cedc;border-radius:12px;
    background:#fff;color:inherit;transition:border-color .2s var(--e),box-shadow .2s var(--e);
  }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,111,184,.18)}
  .peek{flex:0 0 auto;width:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .peek:hover{color:var(--accent);border-color:var(--accent)}
  button.submit{
    width:100%;margin-top:16px;min-height:46px;font:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--navy);
    border:0;border-radius:12px;cursor:pointer;transition:transform .2s var(--e),box-shadow .2s var(--e),background-color .2s var(--e);
  }
  button.submit:hover:not(:disabled){transform:translateY(-2px);background:var(--navy-d);box-shadow:0 8px 22px -6px rgba(0,40,86,.55)}
  button.submit:active:not(:disabled){transform:scale(.99)}
  button.submit:disabled{opacity:.6;cursor:progress}
  .msg{margin:14px 0 0;font-size:13.5px;line-height:1.5;min-height:20px;text-align:center;color:#c2261f;font-weight:600}
  .msg[data-tone=info]{color:var(--muted);font-weight:500}
  .foot{margin-top:18px;text-align:center;font-size:12px;line-height:1.55;color:rgba(255,255,255,.62)}
  noscript{display:block;margin-top:16px;font-size:13.5px;color:#c2261f;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      <button type="submit" class="submit" id="go">Accéder à la maquette</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <noscript>Cet espace nécessite JavaScript : le contenu est chiffré et déchiffré dans votre navigateur.</noscript>
  </main>
  <p class="foot">Contenu chiffré (AES-256-GCM), déchiffré dans votre navigateur.<br>Proposition Metasense — maquette de travail, non officielle.</p>
</div>

<script>
(function () {
  'use strict';

  var BASE = '/ahbfc-maquette/', DB = 'preview-ahbfc', SALT = 'ZxoTEqvwF277aoo4ZLJwnA==', ITER = 600000;
  var GUARD = 'preview.boot';

  var $ = function (id) { return document.getElementById(id); };
  var form = $('f'), pwd = $('pwd'), go = $('go'), peek = $('peek'), msg = $('msg');

  function say(text, tone) {
    msg.textContent = text || '';
    if (tone) msg.setAttribute('data-tone', tone); else msg.removeAttribute('data-tone');
  }
  function b64(s) {
    var bin = atob(s.replace(/\s+/g, '')), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  if (!window.crypto || !crypto.subtle || !window.indexedDB || !('serviceWorker' in navigator)) {
    form.style.display = 'none';
    say("Ce navigateur ne peut pas ouvrir la maquette : le déchiffrement a besoin d’une fenêtre normale (pas de navigation privée) et d’un navigateur récent — Chrome, Edge, Firefox ou Safari.");
    return;
  }

  /* ---------------------------------------------------------- IndexedDB */

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req;
      try { req = indexedDB.open(DB, 1); } catch (e) { return reject(e); }
      req.onupgradeneeded = function () {
        if (!req.result.objectStoreNames.contains('k')) req.result.createObjectStore('k');
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function idbGet() {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve) {
        var g = db.transaction('k', 'readonly').objectStore('k').get('key');
        g.onsuccess = function () { resolve(g.result || null); db.close(); };
        g.onerror = function () { resolve(null); db.close(); };
      });
    }).catch(function () { return null; });
  }
  function idbPut(rec) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('k', 'readwrite');
        tx.objectStore('k').put(rec, 'key');
        tx.oncomplete = function () { resolve(); db.close(); };
        tx.onerror = function () { reject(tx.error); db.close(); };
      });
    });
  }
  function idbClear() {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction('k', 'readwrite');
        tx.objectStore('k').delete('key');
        tx.oncomplete = tx.onerror = function () { resolve(); db.close(); };
      });
    }).catch(function () {});
  }

  /* -------------------------------------------------------------- crypto */

  function derive(password) {
    return crypto.subtle
      .importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
      });
  }

  // Le manifeste chiffré sert de test du mot de passe : s'il se déchiffre, la clé est bonne.
  function verify(key) {
    return fetch(BASE + '_p/manifest.bin', { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw Object.assign(new Error('manifest ' + res.status), { net: true });
      return res.arrayBuffer();
    }).then(function (buf) {
      var blob = new Uint8Array(buf);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(0, 12) }, key, blob.slice(12));
    }).then(function (plain) {
      JSON.parse(new TextDecoder().decode(plain));
      return true;
    });
  }

  /* -------------------------------------------------- service worker + boot */

  function guard() {
    var raw = null;
    try { raw = sessionStorage.getItem(GUARD); } catch (e) { return 0; }
    var st = raw ? JSON.parse(raw) : null;
    if (!st || Date.now() - st.t > 30000) st = { n: 0, t: Date.now() };
    st.n += 1; st.t = Date.now();
    try { sessionStorage.setItem(GUARD, JSON.stringify(st)); } catch (e) {}
    return st.n;
  }

  function activate() {
    say('Ouverture de la maquette…', 'info');
    return navigator.serviceWorker.register(BASE + 'sw.js', { scope: BASE })
      .then(function () { return navigator.serviceWorker.ready; })
      .then(function () {
        if (guard() > 3) {
          go.disabled = false;
          say("Votre navigateur bloque l’affichage de la maquette (service worker désactivé). Essayez une fenêtre normale, ou un autre navigateur.");
          return;
        }
        location.reload();
      })
      .catch(function () {
        go.disabled = false;
        say("Le navigateur a refusé d’ouvrir la maquette. Réessayez dans une fenêtre normale (hors navigation privée).");
      });
  }

  // 1) Clé déjà déposée sur cet appareil → on ouvre sans redemander le mot de passe.
  idbGet().then(function (rec) {
    if (!rec || !rec.key) { setTimeout(function () { pwd.focus(); }, 50); return; }
    say('Ouverture de la maquette…', 'info');
    return verify(rec.key).then(activate, function (err) {
      if (err && err.net) { say('Contenu momentanément indisponible. Rechargez la page.'); return; }
      return idbClear().then(function () { say(''); pwd.focus(); });
    });
  });

  // 2) Saisie du mot de passe.
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!pwd.value) return;
    go.disabled = true;
    say('Vérification…', 'info');

    derive(pwd.value)
      .then(function (key) {
        return verify(key).then(function () {
          return idbPut({ key: key, at: Date.now() }).then(activate);
        });
      })
      .catch(function (err) {
        go.disabled = false;
        if (err && err.net) { say('Contenu momentanément indisponible. Rechargez la page.'); return; }
        say('Mot de passe incorrect.');
        pwd.select();
      });
  });

  peek.addEventListener('click', function () {
    var shown = pwd.type === 'text';
    pwd.type = shown ? 'password' : 'text';
    peek.setAttribute('aria-label', shown ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
    pwd.focus();
  });
})();
</script>
</body>
</html>
